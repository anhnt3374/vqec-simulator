# CPU baseline: edit a local copy and restart ai-worker to change the admission rate.
input_uri: rtsp://mediamtx:8554/relay
output_uri: rtsp://mediamtx:8554/ai
models_dir: /opt/vqec/models/live_ai
processing_fps: 0                 # 0 = unlimited; examples: 5, 10, 15, 20, 30
output: {width: 1280, height: 720, fps: 15} # encoder nominal FPS; does not duplicate frames
person: {confidence: 0.35, nms_iou: 0.5, num_threads: 1}
face: {confidence: 0.35, nms_iou: 0.5, num_threads: 1}
queue_capacity: 2
io_timeout_ms: 10000
stats_interval_seconds: 10
logging: {level: info, directory: /var/log/vqec}

# ByteTrack: low-score detections preserve tracks; only new_threshold starts IDs.
# NanoDet effective confidence is min(person.confidence, tracking.low_threshold).
tracking:
  low_threshold: 0.1
  high_threshold: 0.35
  new_threshold: 0.45
  match_cost: 0.8
  low_match_cost: 0.5
  tentative_match_cost: 0.7
  lost_timeout_ms: 1000
  max_tracks: 128

# Emulate AI + tracking occupying at least 1/ai_fps seconds per frame.
# Keep processing_fps: 0 for throughput simulation. 0 disables, otherwise 1..1000.
simulation:
  ai_fps: 0
